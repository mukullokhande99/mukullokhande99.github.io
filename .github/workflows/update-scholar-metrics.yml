name: Update Google Scholar metrics

on:
  push:
    branches: [master]
    paths:
      - "scripts/update_scholar_metrics.py"
      - ".github/workflows/update-scholar-metrics.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Fetch Google Scholar metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_scholar_metrics.py

      - name: Commit changed metrics
        run: |
          if git diff --quiet -- data/scholar-metrics.json; then
            echo "No metric changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar-metrics.json
          git commit -m "Update Google Scholar metrics"
          git push
